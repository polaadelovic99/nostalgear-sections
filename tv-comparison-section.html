<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        .tv-comparison-section {
            position: relative;
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
            background: transparent;
            overflow: hidden; 
        }

        /* Frame Container */
        .frame-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            background-color: transparent;
            overflow: hidden;
        }


        .videos-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden; 
        }


        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://plutonagency.com/pola/wp-content/uploads/2025/12/Group-29-1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            pointer-events: none; 
        }

        :root {
            --video-width: 100%; 
            --video-height: 100%; 
        }

        /* Single Video Container - Positioned to match screen area */
        .video-container {
            position: absolute;
            top: 9.5%;
            left: 15.5%;
            width: 59%;
            height: 81%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Video - Full width before/after video */
        .comparison-video {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Play Button - Centered Overlay */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            cursor: pointer;
            z-index: 20; /* Above frame overlay */
            transition: transform 0.2s, opacity 0.3s;
            background: transparent;
            border: none;
            padding: 0;
        }

        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: transparent;
        }

        .play-button:active {
            transform: translate(-50%, -50%) scale(0.95);
            background: transparent;
        }

        .play-button:focus {
            background: transparent;
            outline: none;
        }

        .play-button.playing {
            opacity: 0;
            pointer-events: none;
        }

        /* Play Button SVG */
        .play-button svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .tv-comparison-section {
                background-color: #EFEADD;
            }

            .play-button {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 480px) {
            .play-button {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <section class="tv-comparison-section">
        <div class="frame-container">
            <!-- Videos Wrapper - Single video behind the frame -->
            <div class="videos-wrapper">
                <!-- Single Before/After Comparison Video -->
                <div class="video-container">
                    <video class="comparison-video" id="comparisonVideo" muted loop playsinline>
                        <!-- Replace with your before/after comparison video URL -->
                        <source src="https://plutonagency.com/pola/wp-content/uploads/2025/12/NostalGear-Avant-et-Apres-lamelioration-graphique-NostalGear™-Retrogaming-1080p-h264.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <div class="frame-overlay"></div>
            <button class="play-button" id="playButton" aria-label="Play video">
                <svg width="182" height="182" viewBox="0 0 182 182" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="90.8621" cy="90.8621" r="88.3621" fill="white" stroke="#EA0F09" stroke-width="5"/>
                    <path d="M122.574 111.726H110.031V125.424H97.3188V139.276H84.6069V139.275H72.6948V112.545H85.4067V125.422H97.3179V111.568H109.862V97.8711H122.574V111.726ZM72.6938 114.489H59.9819V66.0146H72.6938V114.489ZM135.455 97.873H122.743V84.2705H135.455V97.873ZM122.744 84.0156H110.032V70.1602H122.744V84.0156ZM97.3188 56.3066H110.031V70.1611H97.3179V56.3066H85.4067V69.1348H72.6948V42.4521H84.6069V42.4512H97.3188V56.3066Z" fill="#EA0F09"/>
                </svg>
            </button>
        </div>
    </section>

    <script>
        (function() {
            const customTvPlayButton = document.getElementById('playButton');
            const customComparisonVideo = document.getElementById('comparisonVideo');
            
            if (customTvPlayButton && customComparisonVideo) {
                customTvPlayButton.addEventListener('click', function() {
                    const playPromise = customComparisonVideo.play();

                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                            })
                            .catch(error => {
                                console.log('Video autoplay prevented:', error);
                            });
                    }

                    customTvPlayButton.classList.add('playing');
                });

                customComparisonVideo.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!customComparisonVideo.paused) {
                        customComparisonVideo.pause();
                        customTvPlayButton.classList.remove('playing');
                    }
                });

                customComparisonVideo.addEventListener('ended', function() {
                    if (!customComparisonVideo.loop) {
                        customTvPlayButton.classList.remove('playing');
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if (e.code === 'Space' && e.target === document.body) {
                        e.preventDefault();
                        if (customComparisonVideo.paused) {
                            customTvPlayButton.click();
                        } else {
                            customComparisonVideo.pause();
                            customTvPlayButton.classList.remove('playing');
                        }
                    }
                });
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Reviews Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* Scoped Styles for New Reviews Section */
        .nr-section {
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: transparent; /* Or match parent background if needed */
        }

        .nr-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1460px; 
            margin: 0 auto;
        }

        .nr-card {
            position: relative;
            width: 100%;
            height: 473px;
            border-radius: 13px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 32px;
            box-sizing: border-box;
            color: #000;
            background-image: url('https://sub.nostalgear.fr/wp-content/uploads/2025/12/Rectangle-32.png');
            background-size: 100% 100%; /* Stretch to fill */
            background-position: center;
            background-repeat: no-repeat;
        }


        .nr-card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 32px;
            height: 100%;
        }

        /* Header: Avatar + Info */
        .nr-card-header {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .nr-avatar {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .nr-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nr-user-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nr-user-name {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
            font-size: 24px; /* Estimated from visual */
            margin: 0;
        }

        .nr-stars {
            display: flex;
            gap: 5px;
        }

        .nr-stars-img {
            height: 24px;
            width: auto;
            display: block;
        }

        /* Review Body */
        .nr-review-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nr-quote-icon {
           font-size: 60px;
           line-height: 1;
           font-family: serif;
           margin-bottom: -20px;
           display: block;
        }
        
        .nr-quote-img {
            width: 26px;
            height: 21px;
            display: block;
        }

        .nr-review-text {
            font-family: 'Genova', sans-serif; /* Fallback to sans-serif */
            font-size: 20px;
            line-height: 1.2;
            margin: 0;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .nr-container {
                display: flex; /* Switch to flexbox for slider */
                grid-template-columns: unset; /* Remove grid layout */
                overflow-x: auto; /* Enable horizontal scrolling */
                scroll-snap-type: x mandatory; /* Enable scroll snapping */
                -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
                gap: 20px;
                padding-bottom: 20px; /* Bottom spacing */
                scrollbar-width: none; /* Hide scrollbar for Firefox */
                -ms-overflow-style: none; /* Hide scrollbar for IE/Edge */
            }

            /* Hide scrollbar for WebKit */
            .nr-container::-webkit-scrollbar {
                display: none;
            }
            
            .nr-card {
                flex: 0 0 calc(50% - 10px); /* 2 cards per row for tablet */
                width: calc(50% - 10px);
                scroll-snap-align: start; /* Align to start for 2-up view */
                height: auto;
                min-height: 473px;
                margin-right: 0;
                padding: 20px; /* Further reduced padding */
            }

            /* Resizing elements for mobile/tablet */
            .nr-avatar {
                width: 80px;
                height: 80px;
            }

            .nr-user-name {
                font-size: 20px;
                white-space: nowrap; /* Prevent name from wrapping */
            }

            .nr-stars-img {
                height: 20px;
            }

            .nr-card-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
                width: 100%; /* Ensure full width usage */
            }

            .nr-user-info {
                align-items: center;
                width: 100%; /* Ensure full width usage */
            }
            
            .nr-card-content {
                height: auto; /* Allow content to dictate height */
            }
        }

        /* Mobile specific overrides (Standard Mobile Breakpoint) */
        @media (max-width: 767px) {
            .nr-card {
                flex: 0 0 90%; /* Back to single card */
                width: 90%;
                scroll-snap-align: center; /* Center snap for single focus */
            }
        }
    </style>
</head>
<body>

<section class="nr-section">
    <div class="nr-container">
        <!-- Card 1 -->
        <div class="nr-card">

            <div class="nr-card-content">
                <div class="nr-card-header">
                    <div class="nr-avatar">
                        <!-- Placeholder Avatar -->
                        <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/Ellipse-116-1.png" alt="Germain D.">
                    </div>
                    <div class="nr-user-info">
                        <h3 class="nr-user-name">Germain D.</h3>
                        <div class="nr-stars">
                             <!-- 5 Stars Image -->
                             <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/Frame-182.png" alt="5 stars" class="nr-stars-img">
                        </div>
                    </div>
                </div>
                <div class="nr-review-body">
                    <svg class="nr-quote-img" width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 21.06V12.44C0 6.6 4.2 1.48 10.2 0L12.04 3.76C8.6 4.6 6.32 7.08 5.72 10.4H11.2V21.06H0ZM13.84 21.06V12.44C13.84 6.6 18.04 1.48 24.04 0L25.88 3.76C22.44 4.6 20.16 7.08 19.56 10.4H25.04V21.06H13.84Z" fill="black"/>
                    </svg>
                    <p class="nr-review-text">
                        Excellent produit. Excellent service. Excellent site. Je retombe en enfance. merci !!!
                    </p>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="nr-card">

            <div class="nr-card-content">
                <div class="nr-card-header">
                    <div class="nr-avatar">
                        <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/E2llipse-116.png" alt="Fabien R.">
                    </div>
                    <div class="nr-user-info">
                        <h3 class="nr-user-name">Fabien R.</h3>
                        <div class="nr-stars">
                             <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/Frame-182.png" alt="5 stars" class="nr-stars-img">
                        </div>
                    </div>
                </div>
                <div class="nr-review-body">
                    <svg class="nr-quote-img" width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 21.06V12.44C0 6.6 4.2 1.48 10.2 0L12.04 3.76C8.6 4.6 6.32 7.08 5.72 10.4H11.2V21.06H0ZM13.84 21.06V12.44C13.84 6.6 18.04 1.48 24.04 0L25.88 3.76C22.44 4.6 20.16 7.08 19.56 10.4H25.04V21.06H13.84Z" fill="black"/>
                    </svg>
                    <p class="nr-review-text">
                        Excellente console, possède une incroyable variété de jeux, je la recommande à 100%.
                    </p>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="nr-card">

            <div class="nr-card-content">
                <div class="nr-card-header">
                    <div class="nr-avatar">
                        <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/Ellipse-116-1.png" alt="Germain D.">
                    </div>
                    <div class="nr-user-info">
                        <h3 class="nr-user-name">Germain D.</h3>
                        <div class="nr-stars">
                             <img src="https://sub.nostalgear.fr/wp-content/uploads/2025/12/Frame-182.png" alt="5 stars" class="nr-stars-img">
                        </div>
                    </div>
                </div>
                <div class="nr-review-body">
                    <svg class="nr-quote-img" width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 21.06V12.44C0 6.6 4.2 1.48 10.2 0L12.04 3.76C8.6 4.6 6.32 7.08 5.72 10.4H11.2V21.06H0ZM13.84 21.06V12.44C13.84 6.6 18.04 1.48 24.04 0L25.88 3.76C22.44 4.6 20.16 7.08 19.56 10.4H25.04V21.06H13.84Z" fill="black"/>
                    </svg>
                    <p class="nr-review-text">
                        Excellent produit. Excellent service. Excellent site. Je retombe en enfance. merci !!!
                    </p>
                </div>
            </div>
        </div>

    </div>
</section>

</body>
</html>

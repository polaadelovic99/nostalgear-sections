<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .reviews-section-main-container {
            margin: 0 auto;
            align-items: center;
            font-family: 'Roboto Mono', monospace;
        }

        .reviews-section-slider {
            display: flex;
            align-items: flex-end;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: none !important;
            padding: 40px 22px; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            cursor: grab;
        }

        .reviews-section-slider.active {
            cursor: grabbing;
            cursor: -webkit-grabbing;
        }

        .reviews-section-slider::-webkit-scrollbar {
            display: none;
        }

        .reviews-section-review-card {
            position: relative;
            flex: 0 0 auto;
            width: 440px; 
            height: 222px;  
            scroll-snap-align: none !important; /* Force disable snapping */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reviews-section-review-connector {
            flex: 0 0 auto;
            width: 60px;
            height: 60px;
            margin-left: -16.5px;
            margin-right: -16.5px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            align-self: center;
        }

        .reviews-section-card-bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .reviews-section-card-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        .reviews-section-card-title {
            font-weight: 700;
            font-size: 30px;
            line-height: 1.2;
            color: #EA0F09;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .reviews-section-card-text {
            font-weight: 400;
            font-size: 25px;
            line-height: 1.4;
            color: #000000;
            margin: 0;
            max-width: 80%;
        }

        .reviews-section-card-icon {
            position: absolute;
            right: 30px;
            top: 25%;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tablet: 768px to 1440px */
        @media (max-width: 1440px) and (min-width: 768px) {
            .reviews-section-slider {
                padding: 30px 16px;
            }

            .reviews-section-review-card {
                width: 420px;
                height: 210px;
            }

            .reviews-section-review-card .reviews-section-card-bg-svg svg {
                width: 428px;
                height: 197px;
            }

            .reviews-section-card-title {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .reviews-section-card-text {
                font-size: 20px;
            }

            .reviews-section-review-connector {
                width: 50px;
                height: 50px;
                margin-left: -12px;
                margin-right: -12px;
            }

            .reviews-section-card-icon {
                width: 70px;
                height: 70px;
                right: 25px;
            }

            .reviews-section-card-icon svg {
                width: 70px;
                height: 70px;
            }
        }

        /* Large screens: 1440px and above - ensure 3 cards visible */
        @media (min-width: 1440px) {
            .reviews-section-review-card {
                width: 440px;
            }
        }

        /* Mobile: under 768px */
        @media (max-width: 767px) {
            .reviews-section-main-container {
                max-width: 100%;
                overflow: hidden;
            }

            .reviews-section-slider {
                padding: 20px 0 20px 16px;
                gap: 0;
                scroll-padding-left: 16px;
            }

            .reviews-section-review-card {
                width: 220px;
                height: 103px;
                flex-shrink: 0;
            }

            .reviews-section-review-card .reviews-section-card-bg-svg svg {
                width: 221px;
                height: 103px;
            }

            .reviews-section-card-content {
                padding: 8px 15px;
                justify-content: flex-start;
            }

            .reviews-section-card-title {
                font-size: 12px;
                margin-bottom: 8px;
                line-height: 1.2;
                padding: 10px;
            }

            .reviews-section-card-text {
                font-size: 10px;
                line-height: 1.4;
                max-width: 75%;
                padding: 0 10px;
            }

            .reviews-section-review-connector {
                width: 35px;
                height: 35px;
                margin-left: -8px;
                margin-right: -8px;
            }

            .reviews-section-card-icon {
                width: 37px;
                height: 37px;
                right: 10px;
                top: 20%;
            }

            .reviews-section-card-icon svg {
                width: 37px;
                height: 37px;
            }
        }
    </style>
</head>

                    <p class="reviews-section-card-text">50-200€ pour une seule cartouche rare</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const slider = document.querySelector('.reviews-section-slider');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
            e.preventDefault(); // Prevent text selection during drag start
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.classList.remove('active');
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.classList.remove('active');
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // Scroll-fast
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
</html>


<head>
    <style>
        .gallery-container {
            position: relative;
            /* Show exactly 2.5 cards: (570.237 * 2.5) + (39.158 * 2) */
            max-width: calc((570.237px * 2.5) + (39.158px * 2));
            margin: 0 auto;
            padding: 0;
            overflow: hidden;
        }

        .video-gallery {
            display: flex;
            gap: 39.158px;
            align-items: center;
            padding: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        .video-gallery::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }



        .video-card {
            position: relative;
            width: 570.237px;
            height: 323.053px;
            border: 2.447px solid #000000;
            border-radius: 26.921px;
            overflow: hidden;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }



        .video-card iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            max-width: none;
            border: none;
            z-index: 1;
        }

        .video-card .thumbnail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 107.86%;
            height: 126.42%;
            max-width: none;
            object-fit: cover;
            pointer-events: none;
            z-index: 2;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 82.729px;
            height: 82.729px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .play-button svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .video-card.playing .play-button {
            opacity: 0;
            pointer-events: none;
        }

        .video-card.playing .thumbnail {
            opacity: 0;
        }

        .timestamp {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            z-index: 5;
        }

        /* Responsive Design */
        @media (max-width: 1800px) {
            .gallery-container {
                padding: 60px 0;
            }

            .video-gallery {
                gap: 30px;
                padding: 0 30px;
            }

            .video-card {
                width: calc((100vw - 90px) / 2.5);
                height: auto;
                aspect-ratio: 570.237 / 323.053;
                flex-shrink: 0;
            }
        }

        @media (max-width: 1400px) {
            .video-card {
                width: 450px;
                height: 255px;
                flex-shrink: 0;
            }

            .play-button {
                width: 65px;
                height: 65px;
            }
        }

        @media (max-width: 1024px) {
            .gallery-container {
                padding: 40px 0;
            }

            .video-gallery {
                gap: 20px;
                padding: 0 20px;
            }

            .video-card {
                width: 380px;
                height: 215px;
                flex-shrink: 0;
            }

            .play-button {
                width: 55px;
                height: 55px;
            }


        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 30px 0;
            }

            .video-gallery {
                gap: 20px;
                padding: 0 15px;
            }

            .video-card {
                width: 320px;
                height: 180px;
                flex-shrink: 0;
            }

            .play-button {
                width: 50px;
                height: 50px;
            }


        }

        @media (max-width: 480px) {
            .video-card {
                width: 280px;
                height: 158px;
                flex-shrink: 0;
            }

            .play-button {
                width: 45px;
                height: 45px;
            }

            .timestamp {
                font-size: 12px;
                padding: 3px 6px;
            }


        }
    </style>
</head>

    <script>
        (function() {
            'use strict';

            const videoGallery = document.getElementById('videoGallery');
            const videoCards = document.querySelectorAll('.video-card');

            // Drag to scroll functionality for desktop
            let isDragging = false;
            let startX;
            let scrollLeft;

            videoGallery.addEventListener('mousedown', function(e) {
                // Don't start dragging if clicking on play button or video card
                if (e.target.closest('.play-button') || e.target.closest('.video-card')) {
                    return;
                }
                isDragging = true;
                videoGallery.style.cursor = 'grabbing';
                startX = e.pageX - videoGallery.offsetLeft;
                scrollLeft = videoGallery.scrollLeft;
            });

            videoGallery.addEventListener('mouseleave', function() {
                isDragging = false;
                videoGallery.style.cursor = 'grab';
            });

            videoGallery.addEventListener('mouseup', function() {
                isDragging = false;
                videoGallery.style.cursor = 'grab';
            });

            videoGallery.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
                const x = e.pageX - videoGallery.offsetLeft;
                const walk = (x - startX) * 2; // Scroll speed multiplier
                videoGallery.scrollLeft = scrollLeft - walk;
            });

            // Set initial cursor
            videoGallery.style.cursor = 'grab';

            // Get all video cards

            // YouTube video play functionality
            videoCards.forEach(card => {
                const iframe = card.querySelector('iframe');
                const playButton = card.querySelector('.play-button');
                const thumbnail = card.querySelector('.thumbnail');
                const youtubeId = card.dataset.youtubeId;
                let isPlaying = false;

                // Play/Stop toggle functionality
                function toggleVideo() {
                    if (isPlaying) {
                        // Stop the video
                        iframe.src = '';
                        card.classList.remove('playing');
                        isPlaying = false;
                    } else if (youtubeId) {
                        // Stop all other videos
                        videoCards.forEach(otherCard => {
                            if (otherCard !== card) {
                                const otherIframe = otherCard.querySelector('iframe');
                                otherIframe.src = '';
                                otherCard.classList.remove('playing');
                            }
                        });

                        // Load and play this video
                        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
                        card.classList.add('playing');
                        isPlaying = true;
                    }
                }

                // Click on play button
                playButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleVideo();
                });

                // Click on card
                card.addEventListener('click', function() {
                    toggleVideo();
                });

                // Keyboard accessibility
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', 'Play video ' + card.dataset.videoId);

                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleVideo();
                    }
                });
            });

            // Stop all videos when user leaves the page
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    videoCards.forEach(card => {
                        const iframe = card.querySelector('iframe');
                        iframe.src = '';
                        card.classList.remove('playing');
                    });
                }
            });
        })();
    </script>

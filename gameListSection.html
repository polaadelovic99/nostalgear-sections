        const systemMap = new Map();
        const systemsSet = new Set();
        for (let i = 0; i < gameDatabase.length; i++) {
            const sys = gameDatabase[i][0];
            const game = gameDatabase[i][1];
            systemsSet.add(sys);
            if (!systemMap.has(sys)) systemMap.set(sys, []);
            systemMap.get(sys).push(game);
        }
        const allSystems = Array.from(systemsSet).sort();
        let selectedSystem = null;
        const sysContainer = document.getElementById('system-container');
        const sysInput = document.getElementById('system-input');
        const sysList = document.getElementById('system-list');
        const gameContainer = document.getElementById('game-container');
        const gameInput = document.getElementById('game-input');
        const gameList = document.getElementById('game-list');
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        function renderList(listEl, containerEl, items, onSelect, query = '') {
            listEl.innerHTML = '';
            if (items.length === 0) {
                listEl.innerHTML = `<div class="no-results"><svg class="no-results-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><div class="no-results-text">Aucun résultat trouvé</div><div class="no-results-subtext">Vérifiez l'orthographe pour "${query}"</div></div>`;
                listEl.classList.add('open');
                containerEl.classList.add('is-open');
                return;
            }
            const fragment = document.createDocumentFragment();
            const limit = Math.min(items.length, 300); 
            let regex = null;
            if (query) regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            for (let i = 0; i < limit; i++) {
                const item = items[i];
                const li = document.createElement('li');
                li.className = 'dropdown-item';
                if (regex) li.innerHTML = item.replace(regex, '<span class="highlight">$1</span>');
                else li.textContent = item;
                li.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    onSelect(item);
                });
                fragment.appendChild(li);
            }
            listEl.appendChild(fragment);
            listEl.classList.add('open');
            containerEl.classList.add('is-open');
        }
        sysInput.addEventListener('focus', () => {
            const val = sysInput.value.trim().toLowerCase();
            const filtered = val ? allSystems.filter(s => s.toLowerCase().includes(val)) : allSystems;
            renderList(sysList, sysContainer, filtered, selectSystem, sysInput.value);
        });
        sysInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allSystems.filter(s => s.toLowerCase().includes(val));
            renderList(sysList, sysContainer, filtered, selectSystem, e.target.value);
            if (selectedSystem && sysInput.value.toLowerCase() !== selectedSystem.toLowerCase()) {
                selectedSystem = null;
                gameInput.value = '';
                gameInput.disabled = true;
                gameContainer.classList.add('disabled');
            }
        });
        sysInput.addEventListener('blur', () => {
            sysList.classList.remove('open');
            sysContainer.classList.remove('is-open');
            if (selectedSystem && sysInput.value !== selectedSystem) sysInput.value = selectedSystem;
            else if (!selectedSystem) sysInput.value = '';
        });
        function selectSystem(system) {
            selectedSystem = system;
            sysInput.value = system;
            sysList.classList.remove('open');
            sysContainer.classList.remove('is-open');
            gameInput.disabled = false;
            gameContainer.classList.remove('disabled');
            gameInput.value = '';
            gameInput.focus();
        }
        gameInput.addEventListener('focus', () => {
            if (!selectedSystem) return;
            const games = systemMap.get(selectedSystem) || [];
            const val = gameInput.value.toLowerCase();
            const filtered = val ? games.filter(g => g.toLowerCase().includes(val)) : games;
            renderList(gameList, gameContainer, filtered, selectGame, gameInput.value);
        });
        gameInput.addEventListener('input', (e) => {
            if (!selectedSystem) return;
            const val = e.target.value.toLowerCase();
            const games = systemMap.get(selectedSystem) || [];
            const filtered = games.filter(g => g.toLowerCase().includes(val));
            renderList(gameList, gameContainer, filtered, selectGame, e.target.value);
        });
        gameInput.addEventListener('blur', () => {
            gameList.classList.remove('open');
            gameContainer.classList.remove('is-open');
        });
        function selectGame(game) {
            gameInput.value = game;
            gameList.classList.remove('open');
            gameContainer.classList.remove('is-open');
        }
    </script>
</body>
</html>
